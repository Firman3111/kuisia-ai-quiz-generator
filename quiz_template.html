<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kuis Interaktif Siswa — Kuisia Edu Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        :root {
            --bg-canvas: #F3ECE0;
            --bg-surface: #FFFDF9;
            --bg-subtle: #EAE0CE;
            --ink-primary: #17181C;
            --ink-secondary: #4D505A;
            --accent-primary: #F26419;
            --accent-primary-hover: #D9530F;
            --accent-secondary: #F6BD2A;
            --accent-soft: #FDE8C8;

            --status-success-bg: #E3F5EB;
            --status-success-text: #146C43;
            --status-error-bg: #FDE8E8;
            --status-error-text: #B42318;

            --border-width: 2px;
            --border-color: var(--ink-primary);
            --radius-sm: 6px;
            --radius-md: 10px;
            --radius-lg: 14px;
            --shadow-offset: 4px 4px 0px var(--ink-primary);
            --shadow-offset-sm: 2px 2px 0px var(--ink-primary);

            --font-display: "Space Grotesk", "Plus Jakarta Sans", system-ui, sans-serif;
            --font-body: "Plus Jakarta Sans", "Inter", system-ui, sans-serif;
            --font-mono: "JetBrains Mono", monospace;
        }

        body {
            background-color: var(--bg-canvas);
            color: var(--ink-primary);
            font-family: var(--font-body);
            line-height: 1.65;
        }

        h1, h2, h3, .font-display {
            font-family: var(--font-display);
        }

        .rf-surface {
            background-color: var(--bg-surface);
            border: var(--border-width) solid var(--border-color);
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-offset);
        }

        .rf-surface-sm {
            background-color: var(--bg-surface);
            border: var(--border-width) solid var(--border-color);
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-offset-sm);
        }

        .rf-badge {
            background-color: var(--accent-secondary);
            color: var(--ink-primary);
            border: 1.5px solid var(--border-color);
            border-radius: var(--radius-sm);
            font-family: var(--font-display);
            font-weight: 700;
        }

        .rf-passage {
            background-color: var(--bg-subtle);
            border-left: 4px solid var(--accent-primary);
            border-top: var(--border-width) solid var(--border-color);
            border-right: var(--border-width) solid var(--border-color);
            border-bottom: var(--border-width) solid var(--border-color);
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-offset-sm);
        }

        .rf-option {
            background-color: var(--bg-surface);
            border: var(--border-width) solid var(--border-color);
            border-radius: var(--radius-sm);
            box-shadow: var(--shadow-offset-sm);
            transition: transform 0.12s ease, box-shadow 0.12s ease, background-color 0.12s ease;
        }

        .rf-option:hover {
            background-color: var(--accent-soft);
            transform: translate(-1px, -1px);
            box-shadow: var(--shadow-offset);
        }

        .rf-option.is-correct {
            background-color: var(--status-success-bg);
            color: var(--status-success-text);
            box-shadow: none;
        }

        .rf-option.is-wrong {
            background-color: var(--status-error-bg);
            color: var(--status-error-text);
            box-shadow: none;
        }

        .rf-btn-primary {
            background-color: var(--accent-primary);
            color: #FFFFFF;
            border: var(--border-width) solid var(--border-color);
            border-radius: var(--radius-sm);
            box-shadow: var(--shadow-offset-sm);
            font-family: var(--font-display);
            font-weight: 700;
            transition: transform 0.12s ease, box-shadow 0.12s ease, background-color 0.12s ease;
        }

        .rf-btn-primary:hover {
            background-color: var(--accent-primary-hover);
            transform: translate(-1px, -1px);
            box-shadow: var(--shadow-offset);
        }

        .rf-btn-primary:active {
            transform: translate(2px, 2px);
            box-shadow: none;
        }

        .rf-input {
            background-color: var(--bg-surface);
            color: var(--ink-primary);
            border: var(--border-width) solid var(--border-color);
            border-radius: var(--radius-sm);
        }

        .rf-input:focus {
            outline: none;
            background-color: var(--accent-soft);
        }

        .rf-spinner {
            border: 4px solid var(--ink-primary);
            border-top-color: var(--accent-primary);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

    <!-- Header -->
    <header class="py-3 px-4 sm:px-6 sticky top-0 z-10" style="background-color: var(--bg-canvas);">
        <div class="max-w-3xl mx-auto rf-surface-sm px-5 py-3 flex justify-between items-center gap-4">
            <div>
                <span id="quiz-meta" class="rf-badge inline-block text-[11px] uppercase tracking-wider px-2 py-0.5 mb-1">Memuat Kuis...</span>
                <h1 id="quiz-title" class="text-base sm:text-lg font-bold leading-snug">Harap tunggu sebentar</h1>
            </div>
            <div id="score-badge" class="hidden px-3.5 py-1.5 rounded-md text-sm font-display font-bold shrink-0" style="background-color: var(--status-success-bg); color: var(--status-success-text); border: 2px solid var(--border-color); box-shadow: var(--shadow-offset-sm);">
                Skor: <span id="score-value">0</span>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-3xl mx-auto px-4 sm:px-6 py-4 w-full my-4 flex-grow">

        <!-- Loading State -->
        <div id="loading" class="rf-surface text-center py-16 px-6">
            <div class="inline-block animate-spin rounded-full h-10 w-10 rf-spinner mb-3"></div>
            <p class="text-sm font-medium" style="color: var(--ink-secondary);">Mengambil lembar soal dari server...</p>
        </div>

        <!-- Identitas Siswa -->
        <div id="student-info-card" class="hidden rf-surface p-5 sm:p-6 mb-6">
            <label for="student-name" class="block text-sm font-display font-bold mb-1.5">Nama Lengkap Siswa</label>
            <input type="text" id="student-name" placeholder="Ketik nama lengkap Anda sebelum mulai..." class="rf-input w-full px-4 py-2.5 text-sm">
        </div>

        <!-- Daftar Soal -->
        <div id="questions-container" class="space-y-6 hidden"></div>

        <!-- Tombol Submit -->
        <div id="submit-section" class="mt-8 hidden">
            <button type="button" onclick="submitQuiz()" class="w-full rf-btn-primary py-3.5 text-base cursor-pointer">
                Selesai &amp; Lihat Hasil Kuis →
            </button>
        </div>

        <!-- Kartu Hasil Akhir -->
        <div id="result-summary" class="hidden mt-8 rf-surface p-8 text-center">
            <span class="rf-badge inline-block text-xs uppercase px-2.5 py-0.5 mb-2">Rekap Nilai</span>
            <h2 class="text-2xl font-bold mb-1">Kuis Selesai Dikerjakan!</h2>
            <p id="result-student-name" class="text-sm mb-5" style="color: var(--ink-secondary);"></p>
            <div id="final-score-box" class="inline-block text-3xl font-display font-bold px-8 py-4 rounded-md mb-4" style="background-color: var(--accent-secondary); color: var(--ink-primary); border: 2px solid var(--border-color); box-shadow: var(--shadow-offset-sm);">
                0 / 100
            </div>
            <p class="text-xs mb-6" style="color: var(--ink-secondary);">Gulir ke atas untuk melihat pembahasan &amp; kunci jawaban setiap nomor.</p>

            <div id="share-achievement-box" class="pt-5" style="border-top: 2px dashed var(--border-color);">
                <p class="text-xs font-display font-bold uppercase tracking-wider mb-3" style="color: var(--ink-secondary);">Bagikan Pencapaian Kuis</p>
                <div class="flex flex-wrap justify-center gap-2.5">
                    <a id="share-fb-btn" href="#" target="_blank" rel="noopener noreferrer" class="rf-option px-3.5 py-2 text-xs font-display font-bold inline-flex items-center gap-1.5">
                        Facebook
                    </a>
                    <a id="share-x-btn" href="#" target="_blank" rel="noopener noreferrer" class="rf-option px-3.5 py-2 text-xs font-display font-bold inline-flex items-center gap-1.5">
                        X (Twitter)
                    </a>
                    <a id="share-wa-btn" href="#" target="_blank" rel="noopener noreferrer" class="rf-option px-3.5 py-2 text-xs font-display font-bold inline-flex items-center gap-1.5">
                        WhatsApp
                    </a>
                    <button type="button" id="share-ig-copy-btn" onclick="copyAchievementForSocial('ig')" class="rf-option px-3.5 py-2 text-xs font-display font-bold inline-flex items-center gap-1.5 cursor-pointer">
                        Instagram (Salin Teks)
                    </button>
                    <button type="button" id="share-native-btn" onclick="shareNativeAchievement()" class="hidden rf-option px-3.5 py-2 text-xs font-display font-bold inline-flex items-center gap-1.5 cursor-pointer">
                        Lainnya
                    </button>
                </div>
                <p id="share-feedback-msg" class="text-xs font-semibold mt-3 hidden" style="color: var(--status-success-text);"></p>
            </div>
        </div>

    </main>

    <footer class="text-center py-4 text-xs" style="color: var(--ink-secondary); font-family: var(--font-mono);">
        KUISIA EDU HUB • Lembar Kuis Interaktif
    </footer>

    <script>
    const API_BASE = window.location.origin;
    let quizQuestions = [];
    let userAnswers = {};
    let isSubmitted = false;

    const pathParts = window.location.pathname.split('/').filter(Boolean);
    const slug = pathParts[pathParts.length - 1] || '';

    function stripTags(str) {
        return String(str || '').replace(/\[[^\]]*\]/g, ' ').replace(/\s{2,}/g, ' ').trim();
    }

    function escapeHtml(str) {
        return String(str || '')
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;');
    }

    function passageKey(text) {
        return stripTags(text).toLowerCase().replace(/[^a-z0-9]+/g, '').slice(0, 80);
    }

    function resolveImageUrl(urlOrFile) {
        if (!urlOrFile) return '';
        const val = String(urlOrFile).trim();
        if (!val) return '';
        if (val.startsWith('http://') || val.startsWith('https://') || val.startsWith('/')) {
            return val;
        }
        return `${API_BASE}/media/${encodeURIComponent(val)}`;
    }

    function buildTableHtml(tableRows) {
        if (!Array.isArray(tableRows) || tableRows.length === 0) return '';
        const colCount = Math.max(...tableRows.map(r => Array.isArray(r) ? r.length : 0));
        if (colCount <= 0) return '';

        let html = `<div class="overflow-x-auto my-4"><table class="w-full border-collapse text-sm" style="border: 2px solid var(--border-color);">`;
        tableRows.forEach((row, rIdx) => {
            html += `<tr>`;
            for (let cIdx = 0; cIdx < colCount; cIdx++) {
                const cellVal = Array.isArray(row) && cIdx < row.length ? escapeHtml(stripTags(row[cIdx])) : '';
                if (rIdx === 0) {
                    html += `<th class="px-3 py-2 text-left font-display font-bold" style="background-color: var(--bg-subtle); border: 1.5px solid var(--border-color);">${cellVal}</th>`;
                } else {
                    html += `<td class="px-3 py-2" style="border: 1.5px solid var(--border-color);">${cellVal}</td>`;
                }
            }
            html += `</tr>`;
        });
        html += `</table></div>`;
        return html;
    }

    function buildPassageBoxHtml(passageText, startNum, endNum) {
        const cleanFull = stripTags(passageText);
        if (!cleanFull) return '';

        const lines = String(passageText || '')
            .split('\n')
            .map(l => stripTags(l))
            .filter(Boolean);

        const rangeLabel = endNum > startNum
            ? `Bacalah teks berikut untuk menjawab soal nomor ${startNum} s.d. ${endNum}!`
            : `Bacalah teks berikut untuk menjawab soal nomor ${startNum}!`;

        let paragraphsHtml = '';
        lines.forEach((line, idx) => {
            const isTitle = idx === 0 && line.length <= 65 && !line.endsWith('.');
            if (isTitle) {
                paragraphsHtml += `<p class="font-display font-bold text-center mb-2">${escapeHtml(line)}</p>`;
            } else {
                paragraphsHtml += `<p class="text-sm leading-relaxed indent-6 mb-2 last:mb-0" style="color: var(--ink-primary);">${escapeHtml(line)}</p>`;
            }
        });

        return `
            <div class="rf-passage p-5">
                <div class="text-xs font-bold italic mb-2" style="color: var(--accent-primary-hover);">${escapeHtml(rangeLabel)}</div>
                ${paragraphsHtml}
            </div>
        `;
    }

    async function loadQuiz() {
        try {
            const response = await fetch(`${API_BASE}/api/get-quiz/${encodeURIComponent(slug)}`);
            if (!response.ok) throw new Error("Kuis tidak ditemukan atau tautan sudah tidak valid.");

            const data = await response.json();
            const quizPayload = data.quiz_data || {};
            quizQuestions = Array.isArray(quizPayload.questions) ? quizPayload.questions : [];

            document.title = data.title || "Kuis Interaktif";
            document.getElementById('quiz-meta').textContent = `${data.subject || 'Umum'} • ${data.grade || 'Umum'}`;
            document.getElementById('quiz-title').textContent = data.title || "Latihan Soal";

            document.getElementById('loading').classList.add('hidden');
            document.getElementById('student-info-card').classList.remove('hidden');
            document.getElementById('questions-container').classList.remove('hidden');
            document.getElementById('submit-section').classList.remove('hidden');

            renderQuestions();
        } catch (err) {
            document.getElementById('loading').innerHTML = `<p class="font-bold text-sm" style="color: var(--status-error-text);">${escapeHtml(err.message)}</p>`;
        }
    }

    function renderQuestions() {
        const container = document.getElementById('questions-container');
        container.innerHTML = '';
        const printedPassageKeys = new Set();

        quizQuestions.forEach((q, index) => {
            const qNum = index + 1;
            const pText = (q.passage || '').trim();
            const pKey = passageKey(pText);

            if (pText && pKey && !printedPassageKeys.has(pKey)) {
                let endNum = qNum;
                for (let nextIdx = index + 1; nextIdx < quizQuestions.length; nextIdx++) {
                    const nextKey = passageKey(quizQuestions[nextIdx].passage || '');
                    if (nextKey === pKey) {
                        endNum = nextIdx + 1;
                    } else {
                        break;
                    }
                }
                const passageWrapper = document.createElement('div');
                passageWrapper.innerHTML = buildPassageBoxHtml(pText, qNum, endNum);
                container.appendChild(passageWrapper.firstElementChild);
                printedPassageKeys.add(pKey);
            }

            const card = document.createElement('div');
            card.id = `q-card-${index}`;
            card.className = "rf-surface p-6";

            const cleanQuestion = escapeHtml(stripTags(q.question));
            let bodyHTML = `<div class="font-semibold text-base mb-3"><span class="rf-badge text-xs px-2 py-0.5 mr-2">${qNum}</span>${cleanQuestion}</div>`;

            const rawQImgs = [];
            if (Array.isArray(q.image_urls) && q.image_urls.length > 0) {
                rawQImgs.push(...q.image_urls);
            } else if (Array.isArray(q.image_files) && q.image_files.length > 0) {
                rawQImgs.push(...q.image_files);
            } else if (q.image_url || q.image_file) {
                rawQImgs.push(q.image_url || q.image_file);
            }

            const qImgUrls = rawQImgs.map(resolveImageUrl).filter(Boolean);
            if (qImgUrls.length > 0) {
                bodyHTML += `<div class="my-3 flex flex-wrap gap-3 items-start">`;
                qImgUrls.forEach((imgSrc, imgI) => {
                    bodyHTML += `
                        <img src="${escapeHtml(imgSrc)}" alt="Gambar soal ${qNum} (${imgI + 1})" class="max-h-64 rounded-md object-contain p-1" style="background-color: var(--bg-subtle); border: 2px solid var(--border-color);">
                    `;
                });
                bodyHTML += `</div>`;
            }

            bodyHTML += buildTableHtml(q.table_rows);

            if (q.type === 'multiple_choice' && Array.isArray(q.options)) {
                const optImgs = Array.isArray(q.option_image_urls) ? q.option_image_urls : [];
                const optFiles = Array.isArray(q.option_image_files) ? q.option_image_files : [];

                bodyHTML += `<div class="space-y-2.5 mt-3">`;
                q.options.forEach((opt, optIdx) => {
                    const cleanOpt = escapeHtml(stripTags(opt));
                    const rawOptTrim = String(opt || '').trim();
                    const letterMatch = rawOptTrim.match(/^([A-Da-d])[\.\)\s]/);
                    const letter = letterMatch ? letterMatch[1].toUpperCase() : String.fromCharCode(65 + optIdx);

                    const optImgUrl = resolveImageUrl(optImgs[optIdx] || optFiles[optIdx]);
                    const optImgHtml = optImgUrl
                        ? `<img src="${escapeHtml(optImgUrl)}" alt="Opsi ${letter}" class="max-h-36 mt-2 rounded-md object-contain p-1" style="background-color: var(--bg-subtle); border: 1.5px solid var(--border-color);">`
                        : '';

                    bodyHTML += `
                        <label id="opt-label-${index}-${letter}" class="rf-option flex items-start gap-3 p-3.5 cursor-pointer">
                            <input type="radio" name="question_${index}" value="${letter}" onchange="selectOption(${index}, '${letter}')" class="mt-1 accent-[#F26419]">
                            <div class="text-sm">
                                <div>${cleanOpt}</div>
                                ${optImgHtml}
                            </div>
                        </label>
                    `;
                });
                bodyHTML += `</div>`;
            } else if (q.type === 'matching' && Array.isArray(q.pairs) && q.pairs.length > 0) {
                const rightOptions = q.pairs.map((p, idx) => ({
                    code: String.fromCharCode(65 + idx),
                    label: stripTags(p.right) || `Pilihan ${String.fromCharCode(65 + idx)}`
                }));

                bodyHTML += `<div class="space-y-3 mt-3">`;
                q.pairs.forEach((pairItem, pIdx) => {
                    const leftClean = escapeHtml(stripTags(pairItem.left));
                    const leftImgUrl = resolveImageUrl(pairItem.left_image_url || pairItem.left_image_file);
                    const leftImgHtml = leftImgUrl
                        ? `<img src="${escapeHtml(leftImgUrl)}" alt="Pasangan ${pIdx + 1}" class="max-h-24 mt-1.5 rounded-md object-contain" style="border: 1.5px solid var(--border-color);">`
                        : '';

                    const selectOptionsHtml = rightOptions.map(ro =>
                        `<option value="${ro.code}">${ro.code}. ${escapeHtml(ro.label)}</option>`
                    ).join('');

                    bodyHTML += `
                        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2 p-3 rounded-md" style="background-color: var(--bg-subtle); border: 1.5px solid var(--border-color);">
                            <div class="text-sm">
                                <span class="font-display font-bold">${pIdx + 1}.</span> ${leftClean}
                                ${leftImgHtml}
                            </div>
                            <select data-match-index="${index}" data-pair-idx="${pIdx}" onchange="updateMatchingAnswer(${index})" class="rf-input px-3 py-2 text-sm">
                                <option value="">-- Pilih Pasangan --</option>
                                ${selectOptionsHtml}
                            </select>
                        </div>
                    `;
                });
                bodyHTML += `</div>`;
            } else {
                bodyHTML += `
                    <textarea id="essay-input-${index}" rows="3" placeholder="Tuliskan jawaban Anda di sini..." oninput="selectOption(${index}, this.value)" class="rf-input mt-2 w-full p-3 text-sm"></textarea>
                `;
            }

            bodyHTML += `<div id="feedback-${index}" class="hidden mt-4 p-4 rounded-md text-sm" style="border: 2px solid var(--border-color);"></div>`;

            card.innerHTML = bodyHTML;
            container.appendChild(card);
        });
    }

    function selectOption(qIndex, value) {
        if (isSubmitted) return;
        userAnswers[qIndex] = value;
    }

    function updateMatchingAnswer(qIndex) {
        if (isSubmitted) return;
        const selects = document.querySelectorAll(`select[data-match-index="${qIndex}"]`);
        const mapAns = {};
        selects.forEach(sel => {
            const pIdx = sel.getAttribute('data-pair-idx');
            mapAns[pIdx] = sel.value;
        });
        userAnswers[qIndex] = mapAns;
    }

    function submitQuiz() {
        const studentName = document.getElementById('student-name').value.trim();
        if (!studentName) {
            document.getElementById('student-name').focus();
            return alert("Silakan isi Nama Lengkap Anda terlebih dahulu!");
        }

        isSubmitted = true;
        let mcTotal = 0;
        let mcCorrect = 0;

        quizQuestions.forEach((q, index) => {
            const feedbackBox = document.getElementById(`feedback-${index}`);
            feedbackBox.classList.remove('hidden');

            document.querySelectorAll(`input[name="question_${index}"]`).forEach(inp => inp.disabled = true);
            document.querySelectorAll(`select[data-match-index="${index}"]`).forEach(sel => sel.disabled = true);
            const essayEl = document.getElementById(`essay-input-${index}`);
            if (essayEl) essayEl.disabled = true;

            if (q.type === 'multiple_choice') {
                mcTotal++;
                const chosen = (userAnswers[index] || '').toUpperCase();
                const correctAns = (q.answer || '').trim().charAt(0).toUpperCase();

                const chosenLabel = document.getElementById(`opt-label-${index}-${chosen}`);
                const correctLabel = document.getElementById(`opt-label-${index}-${correctAns}`);

                if (chosen === correctAns) {
                    mcCorrect++;
                    if (chosenLabel) chosenLabel.classList.add('is-correct');
                    feedbackBox.style.backgroundColor = 'var(--status-success-bg)';
                    feedbackBox.style.color = 'var(--status-success-text)';
                    feedbackBox.innerHTML = `<strong>Benar!</strong> ${escapeHtml(stripTags(q.explanation || ''))}`;
                } else {
                    if (chosenLabel) chosenLabel.classList.add('is-wrong');
                    if (correctLabel) correctLabel.classList.add('is-correct');
                    feedbackBox.style.backgroundColor = 'var(--status-error-bg)';
                    feedbackBox.style.color = 'var(--status-error-text)';
                    feedbackBox.innerHTML = `<strong>Kurang Tepat.</strong> Kunci jawaban: <strong>${escapeHtml(correctAns)}</strong>. ${escapeHtml(stripTags(q.explanation || ''))}`;
                }
            } else if (q.type === 'matching' && Array.isArray(q.pairs)) {
                const keyList = q.pairs.map((p, i) => `${i + 1} → ${String.fromCharCode(65 + i)} (${stripTags(p.right)})`);
                feedbackBox.style.backgroundColor = 'var(--accent-soft)';
                feedbackBox.style.color = 'var(--ink-primary)';
                feedbackBox.innerHTML = `<strong>Kunci Pasangan:</strong><br>${escapeHtml(keyList.join(' | '))}`;
            } else {
                const rubricText = stripTags(q.rubric || q.answer || '-');
                feedbackBox.style.backgroundColor = 'var(--accent-soft)';
                feedbackBox.style.color = 'var(--ink-primary)';
                feedbackBox.innerHTML = `<strong>Rubrik / Kunci Jawaban:</strong><br>${escapeHtml(rubricText)}`;
            }
        });

        document.getElementById('submit-section').classList.add('hidden');
        document.getElementById('result-summary').classList.remove('hidden');
        document.getElementById('result-student-name').textContent = `Peserta: ${studentName}`;

        const finalScoreBox = document.getElementById('final-score-box');
        const scoreBadge = document.getElementById('score-badge');

        if (mcTotal > 0) {
            const score = Math.round((mcCorrect / mcTotal) * 100);
            finalScoreBox.textContent = `Skor: ${score} / 100`;
            document.getElementById('score-value').textContent = `${score}/100`;
            scoreBadge.classList.remove('hidden');
        } else {
            finalScoreBox.textContent = `Uraian Selesai`;
        }

        setupAchievementShare(studentName, finalScoreBox.textContent.trim());
        window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
    }

    let lastShareText = '';
    const currentQuizUrl = window.location.href;

    function setupAchievementShare(studentName, scoreSummaryText) {
        const quizTitle = document.getElementById('quiz-title').textContent.trim() || 'Kuis Interaktif';
        lastShareText = `Saya (${studentName}) baru menyelesaikan "${quizTitle}" di Kuisia Edu Hub — ${scoreSummaryText}! Yuk coba juga:`;

        const encodedText = encodeURIComponent(lastShareText);
        const encodedUrl = encodeURIComponent(currentQuizUrl);

        const fbBtn = document.getElementById('share-fb-btn');
        const xBtn = document.getElementById('share-x-btn');
        const waBtn = document.getElementById('share-wa-btn');
        const nativeBtn = document.getElementById('share-native-btn');

        if (fbBtn) {
            fbBtn.href = `https://www.facebook.com/sharer/sharer.php?u=${encodedUrl}&quote=${encodedText}`;
        }
        if (xBtn) {
            xBtn.href = `https://twitter.com/intent/tweet?text=${encodedText}&url=${encodedUrl}`;
        }
        if (waBtn) {
            waBtn.href = `https://wa.me/?text=${encodeURIComponent(lastShareText + ' ' + currentQuizUrl)}`;
        }
        if (nativeBtn && navigator.share) {
            nativeBtn.classList.remove('hidden');
        }
    }

    async function copyAchievementForSocial(platform) {
        const fullText = `${lastShareText} ${currentQuizUrl}`.trim();
        const feedbackEl = document.getElementById('share-feedback-msg');
        try {
            if (navigator.clipboard && navigator.clipboard.writeText) {
                await navigator.clipboard.writeText(fullText);
            } else {
                const tempInput = document.createElement('textarea');
                tempInput.value = fullText;
                document.body.appendChild(tempInput);
                tempInput.select();
                document.execCommand('copy');
                document.body.removeChild(tempInput);
            }
            if (feedbackEl) {
                feedbackEl.textContent = platform === 'ig'
                    ? 'Teks pencapaian disalin! Silakan tempel (paste) di Instagram Story atau caption postingan Anda.'
                    : 'Teks pencapaian berhasil disalin ke clipboard.';
                feedbackEl.classList.remove('hidden');
            }
        } catch (err) {
            if (feedbackEl) {
                feedbackEl.textContent = 'Gagal menyalin otomatis. Silakan salin tautan secara manual.';
                feedbackEl.classList.remove('hidden');
            }
        }
    }

    async function shareNativeAchievement() {
        if (!navigator.share) return;
        try {
            await navigator.share({
                title: document.title || 'Hasil Kuis',
                text: lastShareText,
                url: currentQuizUrl
            });
        } catch (err) {
            // User cancelled share sheet
        }
    }

    loadQuiz();
    </script>
</body>
